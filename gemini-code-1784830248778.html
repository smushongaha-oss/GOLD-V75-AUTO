<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V75 Strategy & Signal Engine</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .app-card {
      background-color: #121826;
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: blink 1s infinite alternate;
    }

    .live-dot.offline {
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: none;
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .header-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .header-badge {
      background-color: #1e293b;
      color: #38bdf8;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* Live Price Card */
    .price-card {
      background-color: #1a2234;
      border: 1px solid #28354d;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
    }

    .price-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .price-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      font-family: monospace;
    }

    /* Signal Panel */
    .signal-panel {
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      background-color: #1a2234;
      border: 1px solid #28354d;
      transition: all 0.3s ease;
    }

    .signal-direction {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 4px;
      color: #64748b;
    }

    .signal-bias {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .signal-panel.BUY {
      background-color: rgba(34, 197, 94, 0.1);
      border: 2px solid #22c55e;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
    }

    .signal-panel.BUY .signal-direction {
      color: #22c55e;
    }

    .signal-panel.SELL {
      background-color: rgba(239, 68, 68, 0.1);
      border: 2px solid #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
    }

    .signal-panel.SELL .signal-direction {
      color: #ef4444;
    }

    /* Target Levels Grid */
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .level-box {
      background-color: #1a2234;
      border: 1px solid #28354d;
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
    }

    .level-title {
      font-size: 0.7rem;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .level-val {
      font-size: 0.85rem;
      font-weight: 700;
      font-family: monospace;
      color: #f8fafc;
    }

    .level-box.entry .level-val { color: #38bdf8; }
    .level-box.tp .level-val { color: #22c55e; }
    .level-box.sl .level-val { color: #ef4444; }

    /* Technical Diagnostics */
    .diag-container {
      background-color: #161c2b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.75rem;
    }

    .diag-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #64748b;
    }

    .diag-row:last-child {
      margin-bottom: 0;
    }

    .diag-val {
      font-weight: 600;
      color: #cbd5e1;
      font-family: monospace;
    }

    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #475569;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="live-dot" id="live-dot"></div>
        <div class="header-title">Volatility 75 Index</div>
      </div>
      <div class="header-badge" id="strategy-badge">EMA + ATR</div>
    </div>

    <!-- Current Price -->
    <div class="price-card">
      <div class="price-label">Live Market Price</div>
      <div class="price-value" id="price-val">0.0000</div>
    </div>

    <!-- Directional Signal Card -->
    <div class="signal-panel" id="signal-panel">
      <div class="signal-direction" id="signal-dir">ANALYZING...</div>
      <div class="signal-bias" id="signal-desc">Gathering tick history</div>
    </div>

    <!-- Trade Execution Levels -->
    <div class="levels-grid">
      <div class="level-box entry">
        <div class="level-title">Entry Point</div>
        <div class="level-val" id="level-entry">---</div>
      </div>
      <div class="level-box tp">
        <div class="level-title">Take Profit</div>
        <div class="level-val" id="level-tp">---</div>
      </div>
      <div class="level-box sl">
        <div class="level-title">Stop Loss</div>
        <div class="level-val" id="level-sl">---</div>
      </div>
    </div>

    <!-- Technical Analysis Diagnostics -->
    <div class="diag-container">
      <div class="diag-row">
        <span>Fast EMA (20):</span>
        <span class="diag-val" id="ema-fast">---</span>
      </div>
      <div class="diag-row">
        <span>Slow EMA (50):</span>
        <span class="diag-val" id="ema-slow">---</span>
      </div>
      <div class="diag-row">
        <span>Volatility Range (ATR):</span>
        <span class="diag-val" id="atr-val">---</span>
      </div>
    </div>

    <div class="footer">Live Algorithmic Stream • Deriv WS</div>
  </div>

  <script>
    const APP_ID = '1089';
    const SYMBOL = 'R_75';
    const HISTORY_COUNT = 100;

    let prices = [];
    let ws;
    let pingInterval;
    let watchDogTimeout;

    function connectWebSocket() {
      if (ws) ws.close();

      ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

      ws.onopen = () => {
        document.getElementById('live-dot').classList.remove('offline');

        // Request tick history to populate indicators immediately
        ws.send(JSON.stringify({
          ticks_history: SYMBOL,
          count: HISTORY_COUNT,
          end: 'latest',
          style: 'ticks'
        }));

        // Subscribe to live tick stream
        ws.send(JSON.stringify({
          ticks: SYMBOL,
          subscribe: 1
        }));

        // Heartbeat
        clearInterval(pingInterval);
        pingInterval = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ ping: 1 }));
          }
        }, 15000);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        resetWatchDog();

        if (data.msg_type === 'history') {
          prices = data.history.prices.map(p => Number(p));
          processTickData();
        }

        if (data.msg_type === 'tick') {
          prices.push(Number(data.tick.quote));
          if (prices.length > HISTORY_COUNT) prices.shift();
          processTickData();
        }
      };

      ws.onclose = () => {
        document.getElementById('live-dot').classList.add('offline');
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = () => ws.close();
    }

    function resetWatchDog() {
      clearTimeout(watchDogTimeout);
      watchDogTimeout = setTimeout(() => connectWebSocket(), 5000);
    }

    // Technical Analysis Calculation Core
    function processTickData() {
      if (prices.length < 50) return;

      const currentPrice = prices[prices.length - 1];
      document.getElementById('price-val').textContent = currentPrice.toFixed(4);

      // 1. Calculate Exponential Moving Averages
      const ema20 = calculateEMA(prices, 20);
      const ema50 = calculateEMA(prices, 50);

      // 2. Calculate Volatility Buffer (Tick ATR Equivalent)
      const atr = calculateTickATR(prices, 14);

      // Update Diagnostics Display
      document.getElementById('ema-fast').textContent = ema20.toFixed(4);
      document.getElementById('ema-slow').textContent = ema50.toFixed(4);
      document.getElementById('atr-val').textContent = atr.toFixed(4);

      // 3. Signal Decision Logic
      const signalPanel = document.getElementById('signal-panel');
      const signalDir = document.getElementById('signal-dir');
      const signalDesc = document.getElementById('signal-desc');

      const entryEl = document.getElementById('level-entry');
      const tpEl = document.getElementById('level-tp');
      const slEl = document.getElementById('level-sl');

      if (ema20 > ema50 && currentPrice > ema20) {
        // BULLISH BUY SIGNAL
        signalPanel.className = 'signal-panel BUY';
        signalDir.textContent = 'STRONG BUY';
        signalDesc.textContent = 'Trend: Bullish Momentum (EMA20 > EMA50)';

        const tpPrice = currentPrice + (atr * 1.5);
        const slPrice = currentPrice - (atr * 1.0);

        entryEl.textContent = currentPrice.toFixed(4);
        tpEl.textContent = tpPrice.toFixed(4);
        slEl.textContent = slPrice.toFixed(4);

      } else if (ema20 < ema50 && currentPrice < ema20) {
        // BEARISH SELL SIGNAL
        signalPanel.className = 'signal-panel SELL';
        signalDir.textContent = 'STRONG SELL';
        signalDesc.textContent = 'Trend: Bearish Momentum (EMA20 < EMA50)';

        const tpPrice = currentPrice - (atr * 1.5);
        const slPrice = currentPrice + (atr * 1.0);

        entryEl.textContent = currentPrice.toFixed(4);
        tpEl.textContent = tpPrice.toFixed(4);
        slEl.textContent = slPrice.toFixed(4);

      } else {
        // NEUTRAL / CONSOLIDATING
        signalPanel.className = 'signal-panel';
        signalDir.textContent = 'NEUTRAL';
        signalDesc.textContent = 'Market consolidating. Awaiting trend alignment.';

        entryEl.textContent = '---';
        tpEl.textContent = '---';
        slEl.textContent = '---';
      }
    }

    // Exponential Moving Average (EMA) Calculation
    function calculateEMA(data, period) {
      const k = 2 / (period + 1);
      let ema = data.slice(0, period).reduce((a, b) => a + b, 0) / period;

      for (let i = period; i < data.length; i++) {
        ema = (data[i] * k) + (ema * (1 - k));
      }
      return ema;
    }

    // Average True Range (ATR) calculation for tick series
    function calculateTickATR(data, period) {
      let ranges = [];
      for (let i = 1; i < data.length; i++) {
        ranges.push(Math.abs(data[i] - data[i - 1]));
      }
      const recentRanges = ranges.slice(-period);
      return recentRanges.reduce((a, b) => a + b, 0) / period;
    }

    // Launch Engine
    connectWebSocket();
  </script>
</body>
</html>
